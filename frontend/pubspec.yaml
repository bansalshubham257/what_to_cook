name: what_to_cook
description: AI Smart Kitchen - What Should I Cook?
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Material 3
  google_fonts: ^6.1.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Local storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Ads
  google_mobile_ads: ^5.1.0

  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^5.1.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.4.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.2

  # No firebase - using local/dev auth only

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "/Users/shubhambansal/Downloads/What_To_Cook.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFBF7"
  adaptive_icon_foreground: "/Users/shubhambansal/Downloads/What_To_Cook.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env
